server:
  port: ${PORT:8080}

spring:
  application:
    name: quality-trace
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:app_db}
    username: ${DB_USER:app_user}
    password: ${DB_PASSWORD:app_password}
    driver-class-name: org.postgresql.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: ${JWT_SECRET:local-dev-secret}
  ttl-ms: 86400000

recalc:
  # 重算失败后按批次号重试的次数与退避
  max-attempts: 3
  backoff-ms: 200
